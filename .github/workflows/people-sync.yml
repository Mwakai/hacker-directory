name: Sync people.json

# Keeps contributors/people.json in step with manifest.json + each card.json,
# so the homepage's single fetch never goes stale. Push uses GITHUB_TOKEN,
# and pushes made with that token don't start new workflow runs, so this
# doesn't retrigger itself.

on:
  push:
    branches: [main]
    paths:
      - "contributors/**"
  # So a maintainer can run it on demand — handy the first time, since
  # merging this workflow doesn't touch contributors/ and so won't trigger it.
  workflow_dispatch:

permissions:
  contents: write

# Two merges close together would otherwise race each other to push. Queue the
# runs instead of cancelling them, so the second one sees the first one's work.
concurrency:
  group: sync-people
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # `ref: main` rather than the commit that triggered the run: a queued run
      # needs the branch as it is now, not as it was when it was queued.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Rebuild people.json
        run: node .github/scripts/build-people.js

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- contributors/people.json; then
            echo "people.json already matches the contributor folders."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contributors/people.json
          git commit -m "chore: sync contributors people.json"
          git push